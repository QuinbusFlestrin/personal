name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

defaults:
  run:
    working-directory: swiss-events

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, dom, curl, libxml, xml
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: swiss-events/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run tests
        run: php artisan test
