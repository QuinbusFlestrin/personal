name: Deploy

on:
  push:
    branches:
      - master

defaults:
  run:
    working-directory: swiss-events

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, dom, curl, libxml, xml
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: swiss-events/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run tests
        run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, libxml, xml
          coverage: none

      # Production vendor/ is built fresh here (--no-dev), never committed.
      - name: Install production PHP dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: swiss-events/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      # Node only ever runs on this GitHub-hosted runner — Infomaniak shared
      # hosting never executes Node, it only receives the compiled output.
      - name: Build frontend assets
        run: npm run build

      # rsync ships the built artifact (vendor/, public/build, application
      # code) to Infomaniak over SSH. storage/ and .env are excluded so a
      # deploy never touches server-side runtime state or secrets — see
      # deploy/infomaniak/rsync-exclude.txt.
      - name: Deploy to Infomaniak via rsync
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete --exclude-from=deploy/infomaniak/rsync-exclude.txt
          path: swiss-events/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Migrations and caches must run against the real production .env
      # (which lives only on the server, never in CI), so this runs after
      # the files are already in place rather than being baked into the
      # rsync'd artifact.
      - name: Run post-deploy commands over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link
